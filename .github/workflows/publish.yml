name: Release And Publish Package
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for `npm publish --provenance`: attests the tarball was
      # built by this GitHub Actions run.
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Type-check
        run: yarn typecheck
      - name: Test
        run: yarn test --run
      - name: Build
        run: yarn build
      - name: Publish
        # Use npm directly. `yarn publish` in yarn 1.x interactively
        # prompts for a new version and also runs through a "Bumping
        # version…" step in --non-interactive mode, which has caused
        # silent re-publish attempts of the existing version.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
