name: Build And Deploy Storybook
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - ".storybook/**"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deploy at a time. If a new push happens while a
# previous deploy is still running, cancel that one — otherwise both
# uploads write the same `github-pages` artifact and deploy-pages fails
# with "Multiple artifacts named 'github-pages' were unexpectedly found".
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build Storybook
        run: yarn build-storybook
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
